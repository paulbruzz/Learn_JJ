<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecnica - Learn Ju-Jitsu</title>
    <link rel="stylesheet" href="style.css?v=20260711d">
    <style>
        .tech-code { font-size: 2rem; font-weight: 800; letter-spacing: 1px; margin: 0; }
        .tech-title { margin-top: 6px; color: #1f2d3d; }
        .tech-box { background:#f7f9fc; border:1px solid #dce3ee; border-radius:10px; padding:14px; }
        .muted { color:#5f6b7a; font-size:0.95rem; }
        .tech-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }
        .tech-card {
            background: #ffffff;
            border: 1px solid #dce3ee;
            border-radius: 10px;
            padding: 12px;
        }
        .tech-card h3 {
            margin: 0 0 8px;
            font-size: 1rem;
            color: #1f2d3d;
        }
        .tech-card ul {
            margin: 0;
            padding-left: 18px;
        }
        .tech-meta {
            display: inline-block;
            margin: 6px 0 10px;
            padding: 4px 10px;
            border-radius: 999px;
            background: #eaf1ff;
            color: #294d87;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .related-links {
            margin-top: 12px;
        }
        .related-links a { margin-right: 10px; }
        .tech-quiz {
            margin-top: 16px;
            border: 1px solid #dce3ee;
            border-radius: 10px;
            background: #ffffff;
            padding: 14px;
        }
        .tech-quiz h3 {
            margin: 0 0 8px;
            color: #1f2d3d;
        }
        .tech-quiz .q {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #edf1f6;
            border-radius: 8px;
            background: #fbfdff;
        }
        .tech-quiz .q.correct {
            border-color: #9cd7a8;
            background: #eefbf1;
        }
        .tech-quiz .q.incorrect {
            border-color: #ef9f95;
            background: #fff3f2;
        }
        .tech-quiz .q.unanswered {
            border-color: #f0cd87;
            background: #fff9eb;
        }
        .tech-quiz .q p {
            margin: 0 0 8px;
            font-weight: 600;
        }
        .tech-quiz .q label {
            display: block;
            margin: 4px 0;
        }
        .tech-quiz .q .q-feedback {
            margin: 8px 0 0;
            font-size: 0.92rem;
            font-weight: 600;
            color: #1f2d3d;
        }
        .tech-quiz-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .quiz-result {
            margin-top: 10px;
            font-weight: 700;
            color: #1f2d3d;
        }
    </style>
</head>
<body>
    <header>
        <h1>Teoria del Ju-Jitsu</h1>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main id="content">
        <section>
            <p class="tech-code" id="code">Tecnica</p>

            <div class="tech-box">
                <p id="snippet"></p>

            <div class="tech-grid">
                <div class="tech-card">
                    <h3>Principi chiave</h3>
                    <ul id="principles"></ul>
                </div>
                <div class="tech-card">
                    <h3>Errori comuni</h3>
                    <ul id="mistakes"></ul>

                <div class="tech-card">
                    <h3>Sicurezza in allenamento</h3>
                    <ul id="safety"></ul>

            <div class="related-links" id="related"></div>

            <div class="tech-quiz" id="tech-quiz">

                <div class="tech-quiz-actions">

        function suffix(code) {
            return (code || '').slice(-1);
        }

        function getFamilyByCode(code) {
            const s = suffix(code);
            if (s === 'A') return 'Controlli e difese iniziali';
            if (s === 'B') return 'Proiezioni e squilibri dinamici';
            if (s === 'C') return 'Leve e immobilizzazioni';
            if (s === 'D') return 'Strangolamenti e controlli al collo';
            if (s === 'E') return 'Difese avanzate e liberazioni';
            return 'Categoria non classificata';
        }

        function getLearningPack(code, title) {
            const s = suffix(code);
            const t = (title || '').toLowerCase();
            const hasKnife = t.includes('pugnalata') || t.includes('fendente');
            const hasKick = t.includes('calcio');
            const hasStrangle = t.includes('strangolamento') || t.includes('jime');

            const base = {
                principles: [
                    'Mantenere postura stabile e baricentro sotto controllo.',
                    'Lavorare su angolo e tempo, non su forza contro forza.',
                    'Concludere la tecnica mantenendo continuità di controllo.'
                ],
                mistakes: [
                    'Entrare troppo frontalmente senza togliersi dalla linea di attacco.',
                    'Bloccare il respiro e irrigidire spalle e braccia.',
                    'Perdere il controllo dell\'arto avversario nella fase finale.'
                ],
                safety: [
                    'Applicare la pressione in modo progressivo e comunicare col partner.',
                    'Interrompere subito su segnale di resa o discomfort.',
                    'Curare sempre la caduta/atterraggio del compagno nelle proiezioni.'
                ],
                related: [
                    { href: 'spostamenti_teoria.html', label: 'Spostamenti' },
                    { href: 'parate_teoria.html', label: 'Parate' }
                ]
            };

            if (s === 'B') {
                base.principles[0] = 'Creare prima il kuzushi (squilibrio), poi entrare con il corpo.';
                base.mistakes[0] = 'Entrare per proiettare senza aver rotto equilibrio e postura avversaria.';
                base.related = [
                    { href: 'proiezioni_teoria.html', label: 'Proiezioni' },
                    { href: 'cadute_teoria.html', label: 'Cadute' }
                ];
            }
            if (s === 'C') {
                base.principles[0] = 'Allineare fulcro, direzione e controllo del polso/gomito/spalla.';
                base.mistakes[0] = 'Forzare la leva in modo brusco invece di costruirla progressivamente.';
                base.related = [
                    { href: 'leve_teoria.html', label: 'Leve articolari' },
                    { href: 'immobilizzazioni_teoria.html', label: 'Immobilizzazioni' }
                ];
            }
            if (s === 'D') {
                base.principles[0] = 'Posizionare bene spalle e avambracci per una chiusura tecnica pulita.';
                base.mistakes[0] = 'Stringere solo con le braccia senza struttura del tronco.';
                base.related = [
                    { href: 'strangolamenti_teoria.html', label: 'Strangolamenti' },
                    { href: 'parate_teoria.html', label: 'Parate' }
                ];
            }
            if (s === 'E') {
                base.principles[0] = 'Rompere la presa con traiettoria breve e ritorno immediato in guardia.';
                base.mistakes[0] = 'Liberarsi senza controllo finale, lasciando spazio a una nuova presa.';
                base.related = [
                    { href: 'saluto_teoria.html', label: 'Disciplina e controllo' },
                    { href: 'spostamenti_teoria.html', label: 'Spostamenti' }
                ];
            }

            if (hasKnife) {
                base.safety.unshift('Allenare attacchi con arma simulata in modo lento e codificato.');
            }
            if (hasKick) {
                base.principles.unshift('Gestire distanza e timing prima del contatto sulla gamba.');
            }
            if (hasStrangle) {
                base.safety.unshift('Nei controlli al collo, rilasciare immediatamente al tap del partner.');
            }

            return base;
        }

        function getDidacticFocus(code, title) {
            const s = suffix(code);
            const t = (title || '').toLowerCase();
            const notes = [];

            if (s === 'A') notes.push('priorità a tempo di ingresso e gestione della distanza');
            if (s === 'B') notes.push('priorità a kuzushi, entrata e direzione della proiezione');
            if (s === 'C') notes.push('priorità ad allineamento di leva e controllo progressivo');
            if (s === 'D') notes.push('priorità a struttura del tronco e chiusura tecnica controllata');
            if (s === 'E') notes.push('priorità a liberazione rapida e consolidamento finale del controllo');

            if (t.includes('pugnalata') || t.includes('fendente')) {
                notes.push('lavoro sempre codificato e progressivo nelle simulazioni con arma');
            }
            if (t.includes('calcio')) {
                notes.push('lettura del timing della gamba e uscita dalla linea d\'attacco');
            }
            if (t.includes('strangolamento') || t.includes('jime')) {
                notes.push('attenzione massima alla sicurezza del collo e rilascio immediato al segnale');
            }

            return notes;
        }

        function buildExtendedSnippet(code, data) {
            const focus = getDidacticFocus(code, data.title);
            if (!focus.length) return data.snippet;
            return `${data.snippet} Focus didattico: ${focus.join('; ')}.`;
        }

        function fillList(el, items) {
            if (!el) return;
            el.innerHTML = items.map(item => `<li>${item}</li>`).join('');
        }

        function fillRelated(el, links) {
            if (!el) return;
            const html = links.map(l => `<a href="${l.href}">${l.label}</a>`).join('');
            el.innerHTML = `<strong>Approfondisci:</strong> ${html}`;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function unique(arr) {
            return [...new Set(arr)];
        }

        function buildTechniqueQuiz(code, data, pack, familyLabel) {
            const familyOptions = [
                'Controlli e difese iniziali',
                'Proiezioni e squilibri dinamici',
                'Leve e immobilizzazioni',
                'Strangolamenti e controlli al collo',
                'Difese avanzate e liberazioni'
            ];

            const title = data.title || '';
            const snippet = data.snippet || '';
            const firstRelated = (pack.related[0] && pack.related[0].label) || 'Spostamenti';

            const q1 = {
                text: `La tecnica ${code} appartiene a quale settore?`,
                options: shuffle(unique([familyLabel, ...familyOptions.filter(f => f !== familyLabel).slice(0, 3)])),
                correct: familyLabel
            };

            const principle = pack.principles[0];
            const wrongPrinciples = [
                'Usare sempre forza massima senza curare timing e postura.',
                'Restare fermi sulla linea di attacco per aumentare stabilità.',
                'Ignorare il controllo finale una volta iniziata la tecnica.'
            ];
            const q2 = {
                text: `Qual è un principio chiave per ${code}?`,
                options: shuffle(unique([principle, ...wrongPrinciples.slice(0, 3)])),
                correct: principle
            };

            const mistake = pack.mistakes[0];
            const q3 = {
                text: `Quale tra queste è indicata come errore comune per ${code}?`,
                options: shuffle(unique([
                    mistake,
                    'Mantenere il baricentro stabile durante tutta l\'azione.',
                    'Applicare pressione progressiva rispettando il partner.',
                    'Concludere la tecnica con controllo posturale.'
                ])),
                correct: mistake
            };

            const safety = pack.safety[0];
            const q4 = {
                text: `Qual è la regola di sicurezza più adatta a ${code}?`,
                options: shuffle(unique([
                    safety,
                    'Accelerare sempre la finalizzazione per renderla più realistica.',
                    'Evitare comunicazione col partner per migliorare il riflesso.',
                    'Bloccare il respiro nella fase di applicazione della tecnica.'
                ])),
                correct: safety
            };

            const all = [q1, q2, q3, q4];
            return shuffle(all);
        }

        function renderTechniqueQuiz(questions) {
            const container = document.getElementById('quiz-tech-container');
            const result = document.getElementById('quiz-tech-result');
            if (!container) return;

            result.textContent = '';
            container.innerHTML = questions.map((q, idx) => {
                const name = `tech-q-${idx}`;
                const answers = q.options.map(opt => {
                    return `<label><input type="radio" name="${name}" value="${opt}"> ${opt}</label>`;
                }).join('');
                return `<div class="q" data-index="${idx}"><p>${idx + 1}. ${q.text}</p>${answers}<p class="q-feedback"></p></div>`;
            }).join('');

            const clearState = (qEl) => {
                if (!qEl) return;
                qEl.classList.remove('correct', 'incorrect', 'unanswered');
                const fb = qEl.querySelector('.q-feedback');
                if (fb) fb.textContent = '';
            };

            container.querySelectorAll('input[type="radio"]').forEach(input => {
                input.addEventListener('change', (ev) => {
                    const qEl = ev.target.closest('.q');
                    clearState(qEl);
                    result.textContent = '';
                });
            });
        }

        function bindTechniqueQuizActions(getQuestions) {
            const checkBtn = document.getElementById('check-tech-quiz');
            const newBtn = document.getElementById('new-tech-quiz');
            const result = document.getElementById('quiz-tech-result');

            if (!checkBtn || !newBtn || !result) return;

            checkBtn.onclick = () => {
                const questions = getQuestions();
                let score = 0;
                const wrong = [];
                const unanswered = [];

                questions.forEach((q, idx) => {
                    const selected = document.querySelector(`input[name="tech-q-${idx}"]:checked`);
                    const qEl = document.querySelector(`.tech-quiz .q[data-index="${idx}"]`);
                    if (!qEl) return;

                    qEl.classList.remove('correct', 'incorrect', 'unanswered');
                    const fb = qEl.querySelector('.q-feedback');

                    if (!selected) {
                        unanswered.push(idx + 1);
                        qEl.classList.add('unanswered');
                        if (fb) fb.textContent = `⚠️ Nessuna risposta. Corretta: ${q.correct}`;
                        return;
                    }

                    if (selected.value === q.correct) {
                        score += 1;
                        qEl.classList.add('correct');
                        if (fb) fb.textContent = '✅ Corretta';
                    } else {
                        wrong.push(idx + 1);
                        qEl.classList.add('incorrect');
                        if (fb) fb.textContent = `❌ Errata. Corretta: ${q.correct}`;
                    }
                });

                if (!wrong.length && !unanswered.length) {
                    result.textContent = `Risultato: ${score}/${questions.length}. Perfetto!`;
                    return;
                }

                const parts = [];
                if (wrong.length) parts.push(`Errate: ${wrong.join(', ')}`);
                if (unanswered.length) parts.push(`Non risposte: ${unanswered.join(', ')}`);
                result.textContent = `Risultato: ${score}/${questions.length}. ${parts.join(' • ')}`;
            };

            newBtn.onclick = () => {
                const questions = getQuestions(true);
                renderTechniqueQuiz(questions);
                result.textContent = '';
            };
        }

        const code = (new URLSearchParams(location.search).get('c') || '').toUpperCase();
        const data = TECH[code];
        const codeEl = document.getElementById('code');
        const titleEl = document.getElementById('title');
        const snEl = document.getElementById('snippet');
        const familyEl = document.getElementById('family');
        const principlesEl = document.getElementById('principles');
        const mistakesEl = document.getElementById('mistakes');
        const safetyEl = document.getElementById('safety');
        const relatedEl = document.getElementById('related');
        const quizBoxEl = document.getElementById('tech-quiz');

        let currentTechQuiz = [];
        const getQuizQuestions = (regenerate = false) => {
            if (regenerate && code && data) {
                const family = getFamilyByCode(code);
                const pack = getLearningPack(code, data.title);
                currentTechQuiz = buildTechniqueQuiz(code, data, pack, family);
            }
            return currentTechQuiz;
        };

        if (!code || !data) {
            codeEl.textContent = 'Codice non trovato';
            titleEl.textContent = 'Tecnica non disponibile';
            snEl.textContent = 'Codice assente o non ancora mappato. Torna al menu e seleziona un codice valido.';
            familyEl.textContent = 'Categoria non disponibile';
            fillList(principlesEl, ['Seleziona un codice valido dal menu principale.']);
            fillList(mistakesEl, ['Nessun dato disponibile senza codice tecnica.']);
            fillList(safetyEl, ['Allenarsi sempre con supervisione e controllo.']);
            fillRelated(relatedEl, [{ href: 'index.html', label: 'Torna al menu' }]);
            if (quizBoxEl) {
                quizBoxEl.style.display = 'none';
            }
        } else {
            const pack = getLearningPack(code, data.title);
            codeEl.textContent = code;
            titleEl.textContent = data.title;
            snEl.textContent = buildExtendedSnippet(code, data);
            familyEl.textContent = getFamilyByCode(code);
            fillList(principlesEl, pack.principles);
            fillList(mistakesEl, pack.mistakes);
            fillList(safetyEl, pack.safety);
            fillRelated(relatedEl, pack.related);

            currentTechQuiz = buildTechniqueQuiz(code, data, pack, getFamilyByCode(code));
            renderTechniqueQuiz(currentTechQuiz);
            bindTechniqueQuizActions(getQuizQuestions);
            document.title = `${code} - Learn Ju-Jitsu`;
        }
    </script>
</body>
</html>
